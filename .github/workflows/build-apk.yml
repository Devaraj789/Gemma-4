name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    name: Build Gemma Offline Chat APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/share/miniconda
          sudo docker image prune -af || true
          sudo apt-get clean
          df -h
      - name: Check NDK versions available
        run: |
          ls $ANDROID_SDK_ROOT/ndk/ 2>/dev/null || echo "No NDK yet"
          df -h
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Install dependencies
        working-directory: artifacts/gemma-chat
        run: pnpm install --no-frozen-lockfile
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Set NDK Path (use pre-installed)
        run: |
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK_PATH" ]; then
            echo "Installing NDK 26..."
            echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;26.3.11579264"
            NDK_PATH="$ANDROID_SDK_ROOT/ndk/26.3.11579264"
          fi
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "Using NDK: $NDK_PATH"
          df -h
      - name: Expo Prebuild
        working-directory: artifacts/gemma-chat
        run: npx expo prebuild --platform android --no-install --clean
        env:
          EXPO_NO_TELEMETRY: "1"
          CI: "1"
      - name: Patch ABI Filter (arm64-v8a only)
        working-directory: artifacts/gemma-chat/android
        run: |
          sed -i 's/reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' gradle.properties
          echo "Verify:" && grep reactNative gradle.properties
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Make Gradlew executable
        working-directory: artifacts/gemma-chat/android
        run: chmod +x gradlew
      - name: Build Release APK
        working-directory: artifacts/gemma-chat/android
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"
      - name: Patch signing for debug key
        working-directory: artifacts/gemma-chat/android/app
        run: |
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' build.gradle
          echo "Signing patched ✅"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gemma-offline-chat-release
          path: artifacts/gemma-chat/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 1
          if-no-files-found: warn
